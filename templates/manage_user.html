
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Task Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='manage_user.css') }}">
</head>

<body>

    <div class="page">
        <div class="card users-card">

            <div class="header">
                <div>
                    <h1>Manage Users</h1>
                    <p>View and manage all users</p>
                </div>

                <a href="/create-user" class="add-button">
                    + Create User
                </a>
            </div>

            <div class="search-box">
                <input type="text" placeholder="Search users...">
            </div>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for user in users %}
                        <tr>
                            <td>{{ user.name }}</td>
                            <td>{{ user.email }}</td>
                            <td>{{ user.role }}</td>

                            <td>
                                {% if user.status == 'Active' %}
                                    <span class="active">Active</span>
                                {% else %}
                                    <span class="inactive">Inactive</span>
                                {% endif %}
                            </td>

                            <td>
                                <a href="/edit-user?id={{ user.id }}"
                                   class="edit-button">Edit</a>
                            </td>
                        </tr>

                        {% else %}
                        <tr>
                            <td colspan="5">No users found.</td>
                        </tr>
                        {% endfor %}
                    </tbody>

                </table>

            </div>

            <br>

            <a href="/dashboard">Back to Dashboard</a>

        </div>
    </div>

</body>
</html>
