<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="page">
        <div class="card">

            <h1>Edit Task</h1>
            <p>Update the task details below.</p>

            <form method="POST">

                <div class="form-group">
                    <label>Task Title</label>
                    <input type="text"
                           name="title"
                           value="{{ task.title }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description"
                              rows="4">{{ task.description or '' }}</textarea>
                </div>

                <div class="form-group">
                    <label>Assign To</label>
                    <select name="assigned_to" required>
                        {% for user in users %}
                        <option value="{{ user.id }}"
                            {% if user.id == task.assigned_to %}selected{% endif %}>
                            {{ user.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Priority</label>
                    <select name="priority">
                        {% for priority in ['Low', 'Medium', 'High', 'Critical'] %}
                        <option value="{{ priority }}"
                            {% if priority == task.priority %}selected{% endif %}>
                            {{ priority }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select name="status">
                        {% for status in ['Pending', 'In Progress', 'Completed'] %}
                        <option value="{{ status }}"
                            {% if status == task.status %}selected{% endif %}>
                            {{ status }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date"
                           name="deadline"
                           value="{{ task.deadline or '' }}">
                </div>

                <button type="submit">Update Task</button>

                <a href="/manage-tasks">Cancel</a>

            </form>

        </div>
    </div>

</body>
</html>
